Control padre temperatura: {{ this.temperatura }}
<app-contol-temperatura
  [temperature]="temperatura"
  [umbral]="umbral"
  class="temperatura"
  (temperatureOutput)="onCambioTemperaturaOutput($event)"
  (umbralOutput)="onUmbralChange($event)"
></app-contol-temperatura>

<app-display-termostato
[temperature]="temperatura"
[umbral]="umbral"
class="termostato"
></app-display-termostato>
